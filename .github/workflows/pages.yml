name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export static site
        env:
          GITHUB_PAGES: "true"
        run: |
          mkdir -p /tmp/knifev-server
          mv app/api /tmp/knifev-server/api
          mv middleware.ts /tmp/knifev-server/middleware.ts
          npx next build
          touch out/.nojekyll
      - name: Publish gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/knifev-publish
          cp -a out /tmp/knifev-publish
          git checkout --orphan gh-pages-publish
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/knifev-publish/. .
          git add -A
          git commit -m "发布 GitHub Pages"
          git push --force origin HEAD:gh-pages
